[project]
name = "fastmcp-test"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.5",
    "typer>=0.27.2",
    "pytest>=8.4.0",
    "requests>=2.34.2",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.3",
    "coverage>=7.16.1",
]

[tool.coverage.run]
source = ["mcp_server", "mcp_server_cli", "settings"]

[tool.coverage.report]
fail_under = 100
show_missing = true
